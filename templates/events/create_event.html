{% extends "base.html" %}
{% block title %}Создать событие{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="card event-card p-4">
        <h2 class="mb-4">Создать новое событие</h2>
        <form method="post" enctype="multipart/form-data">
            <!--  enctype="multipart/form-data" - ОБЯЗАТЕЛЬНО для загрузки файлов  -->
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary-oval btn-oval">Опубликовать событие</button>
        </form>
    </div>
</div>
{% endblock %}
