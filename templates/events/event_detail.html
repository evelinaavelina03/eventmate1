{% extends "base.html" %}
{% block title %}{{ event.title }}{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="card event-card p-4">
        <h1>{{ event.title }}</h1>
        <p><strong>Дата:</strong> {{ event.event_date|date:"d.m.Y H:i" }}</p>
        <p><strong>Место:</strong> {{ event.city.name }}</p>
        <p><strong>Категория:</strong> {{ event.interest.name }}</p>
        <p>{{ event.description }}</p>
        <a href="{% url 'create_listing' %}?event={{ event.event_id }}" class="btn btn-primary-oval btn-oval">Ищу напарника на это событие</a>
    </div>
</div>
{% endblock %}
