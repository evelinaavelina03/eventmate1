{% extends "base.html" %}
{% block title %}Удалить объявление{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="card event-card p-4">
        <h2>Удаление объявления</h2>
        <p>Вы уверены, что хотите удалить объявление <strong>"{{ listing.title }}"</strong>?</p>
        <p>Это действие необратимо.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-oval">Да, удалить</button>
            <a href="{% url 'listing_detail' listing.pk %}" class="btn btn-secondary-oval btn-oval">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
